[project]
name = "wearable-analyzer"
version = "0.1.0"
description = "Source-agnostic analytics for wearable data (Apple Health export and GPX today)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["gpxpy>=1.6", "tzdata; sys_platform == 'win32'"]  # zoneinfo needs tzdata on Windows

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
wearables = "wearables.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wearables*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # inline XML fixtures
